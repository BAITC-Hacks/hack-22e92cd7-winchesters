# Alembic configuration. The database URL is not set here: it comes from
# backend/settings.py (DATABASE_URL), so the app and migrations can never point
# at different databases. Normal use goes through `python -m backend.db init`.
#
# Creating a migration after changing backend/db/tables.py:
#   alembic revision --autogenerate -m "short description"
# then read the generated file before committing it; autogenerate misses
# renames and anything it cannot see in the models.

[alembic]
script_location = %(here)s/backend/migrations
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
